name: probe
# Manual, read-only reconnaissance of store websites before writing their adapters.
on:
  workflow_dispatch:
    inputs:
      sites: { description: "space-separated site URLs", default: "https://www.spinneyslebanon.com" }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e workers
      - run: python workers/tools/site_probe.py ${{ inputs.sites }}
