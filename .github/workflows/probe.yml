name: probe
# Manual, read-only reconnaissance of store websites before writing their adapters.
on:
  workflow_dispatch:
    inputs:
      sites: { description: "site URLs, or --pages URL..., or --save pages URL...", default: "https://www.spinneyslebanon.com" }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e workers
      - run: python workers/tools/site_probe.py ${{ inputs.sites }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pages, path: pages, if-no-files-found: ignore, retention-days: 3 }
