name: scrape

on:
  schedule:
    - cron: "17 */6 * * *"   # prices: every 6 hours
    - cron: "41 4 * * *"     # flyers + housekeeping: daily 06:41 Beirut (winter)
  workflow_dispatch:
    inputs:
      kind: { description: "catalog or flyers", default: "catalog" }
      store: { description: "store slug (empty = all)", default: "" }

concurrency: { group: scrape, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults: { run: { working-directory: workers } }
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PRICEWATCH_PLUGIN_PATHS: ${{ github.workspace }}/workers/plugins
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret not set yet - nothing to scrape."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[vision,dev]"
        if: steps.cfg.outputs.ready == 'true'
      - run: pytest -q
        if: steps.cfg.outputs.ready == 'true'
      - name: Decide what to run
        if: steps.cfg.outputs.ready == 'true'
        id: what
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            if [ "${{ github.event.schedule }}" = "41 4 * * *" ]; then KIND=flyers; else KIND=catalog; fi
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
      - run: pricewatch stores sync
        if: steps.cfg.outputs.ready == 'true'
      - name: Scrape
        if: steps.cfg.outputs.ready == 'true'
        run: |
          STORE="${{ github.event.inputs.store }}"
          if [ -n "$STORE" ]; then pricewatch run ${{ steps.what.outputs.kind }} --store "$STORE";
          else pricewatch run ${{ steps.what.outputs.kind }} --all; fi
      - if: steps.cfg.outputs.ready == 'true' && steps.what.outputs.kind == 'flyers'
        run: pricewatch expire
