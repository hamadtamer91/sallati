name: try-store
# Dry run of one store against the real website: prints normalized prices, writes nothing.
on:
  workflow_dispatch:
    inputs:
      store: { description: "store slug from workers/config/stores.yaml", default: "le-charcutier" }
      limit: { description: "max products", default: "40" }
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: workers } }
    env:
      PRICEWATCH_PLUGIN_PATHS: ${{ github.workspace }}/workers/plugins
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: pricewatch try --store "${{ inputs.store }}" --limit "${{ inputs.limit }}"
