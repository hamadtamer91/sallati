[project]
name = "pricewatch"
version = "0.1.0"
description = "Sallati workers: store adapters, flyer vision extraction, normalization & matching"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "pyyaml>=6",
  "rapidfuzz>=3.6",
  "selectolax>=1.0",
  "pillow>=10",
  "pypdfium2>=4.28",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
vision = ["anthropic>=0.70"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pricewatch = "pricewatch.cli:main"

# Third-party adapters can register themselves without touching this package:
# [project.entry-points."pricewatch.adapters"]
# my_store = "my_package.my_module"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricewatch*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
